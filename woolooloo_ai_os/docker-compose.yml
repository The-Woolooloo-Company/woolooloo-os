version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5002:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://woolooloo:${POSTGRES_PASSWORD:-woolooloo}@postgres:5432/woolooloo_os
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis}@redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://woolooloo:${POSTGRES_PASSWORD:-woolooloo}@postgres:5432/woolooloo_os
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis}@redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
    command: celery -A src.workers.celery_app worker --loglevel=info

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://woolooloo:${POSTGRES_PASSWORD:-woolooloo}@postgres:5432/woolooloo_os
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis}@redis:6379/0
    depends_on:
      - redis
    volumes:
      - .:/app
    command: celery -A src.workers.celery_app beat --loglevel=info

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=woolooloo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-woolooloo}
      - POSTGRES_DB=woolooloo_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woolooloo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
